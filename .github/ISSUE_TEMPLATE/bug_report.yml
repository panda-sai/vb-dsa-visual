name: Bug report
description: Something looks or behaves wrong in a visualization
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Which topic or URL?
      placeholder: e.g. /trees (AVL insert)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Insert 10, 20, 30
        2. Click "Delete" on 20
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome 130 on Android, Safari on iPad
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or recording
      description: Drag and drop images or a short screen recording here.
